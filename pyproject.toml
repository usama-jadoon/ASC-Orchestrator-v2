[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asc-orchestrator"
version = "0.1.0"
description = "ASC Orchestrator v2 core runtime foundation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ASC Orchestrator contributors" }]
dependencies = []

[project.scripts]
asc-orchestrator = "asc_orchestrator.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"

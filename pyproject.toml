[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asc-orchestrator"
version = "2.3.0"
description = "ASC Orchestrator v2.3.0 core runtime and developer operator console"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ASC Orchestrator contributors" }]
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
asc = "asc.cli:main"
asc-orchestrator = "asc_orchestrator.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

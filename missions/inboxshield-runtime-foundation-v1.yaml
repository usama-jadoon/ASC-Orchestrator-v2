id: inboxshield-runtime-foundation-v1

goal: >
  Establish a truthful local PostgreSQL + Redis runtime using the smallest safe
  environment available on this Windows machine.

defaults:
  executor: omp
  working_directory: "D:/Usama Data/All Software/InboxShield-AI"
  max_attempts: 2
  verification_timeout: 900

tasks:

  - id: runtime-foundation
    title: Establish truthful local PostgreSQL and Redis-compatible runtime
    prompt: |
      You are working inside the existing InboxShield-AI repository.

      Continue from the CURRENT repository state.
      Do not restart or redesign the project.

      First inspect:
      - package.json
      - apps/web
      - apps/worker
      - packages/db
      - Prisma configuration
      - existing environment variable usage
      - existing docs
      - existing health checks

      GOAL:
      Establish a truthful local PostgreSQL + Redis runtime using the smallest
      safe environment available on this Windows machine.

      Implement the smallest correct solution for:

      1. PostgreSQL local runtime (prefer existing native PostgreSQL 16 on port 5432)
      2. Redis-compatible local runtime (native Windows service or process for BullMQ)
      3. Safe example environment configuration (.env.example, .env.local.example)
      4. Clear local start/stop instructions without mandatory Docker dependency
      5. Correct database URL and Redis connection strings
      6. Health checks where appropriate

      IMPORTANT ARCHITECTURE RULES:

      - InboxShield remains the TypeScript product.
      - BullMQ remains responsible for scan jobs, retries, scheduling,
        webhook processing and operational workers.
      - PostgreSQL remains InboxShield factual/product storage.
      - Redis-compatible runtime remains BullMQ/runtime infrastructure.
      - Do NOT copy ASC source into InboxShield.
      - Do NOT vendor ASC.
      - Do NOT replace BullMQ with ASC.
      - Do NOT add provider/model routing to InboxShield.
      - Do NOT change scanner factual truth.
      - Do NOT fabricate successful runtime evidence.

      SECURITY:

      - no real credentials in Git
      - use development-safe example credentials only where appropriate
      - document which values must be changed outside local development
      - do not expose unnecessary services publicly

      REPOSITORY SAFETY:

      - inspect current git status before editing
      - preserve pre-existing user changes
      - do not push
      - do not merge
      - do not tag
      - do not release

      Update relevant documentation truthfully.

      Do not claim PostgreSQL/Redis runtime execution was verified unless the
      services were actually started and verified.

      Once implementation is complete, stop.
    verify:
      command: "npx turbo run typecheck && npm test"

  - id: runtime-readiness
    title: Add bounded runtime readiness verification
    depends_on:
      - runtime-foundation
    prompt: |
      Continue from the verified runtime-foundation task.

      Add the smallest maintainable mechanism necessary to verify the
      InboxShield local runtime readiness.

      Inspect existing worker health-check implementation before changing code.

      The desired truth path is:

      PostgreSQL available
        +
      Redis-compatible runtime available
        ↓
      InboxShield dependencies connect
        ↓
      existing health/readiness logic reports real status

      Requirements:

      - reuse existing health-check logic instead of creating duplicate truth
      - failures must remain failures; do not fake successful probes
      - use bounded waits/timeouts
      - do not create endless retry loops
      - preserve existing BullMQ architecture
      - add focused tests where code changes require them
      - update local-development documentation
      - no push, merge, tag or release

      Explicitly report live verification evidence rather than fabricating PASS.

      Stop once the defined task is implemented and verified.
    verify:
      command: "npx turbo run typecheck && npm test && npm run build"
